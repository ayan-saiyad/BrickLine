name: Kubernetes smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/kubernetes-smoke.yml"

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: brickline
          config: deploy/kind/cluster.yaml
          version: v0.33.0
      - name: Deploy and smoke test
        run: scripts/deploy-kind.sh
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl -n brickline get all
          kubectl -n brickline get events --sort-by=.lastTimestamp
          kubectl -n brickline logs deployment/brickline-api --all-pods --tail=100 || true
          kubectl -n brickline logs deployment/brickline-web --all-pods --tail=100 || true

