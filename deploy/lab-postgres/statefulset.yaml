apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: brickline-postgres
  namespace: brickline
  labels:
    app.kubernetes.io/name: brickline-postgres
spec:
  serviceName: brickline-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brickline-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brickline-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: brickline
            - name: POSTGRES_USER
              value: brickline
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brickline-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "brickline", "-d", "brickline"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "brickline", "-d", "brickline"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
